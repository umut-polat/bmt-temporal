# Default test parameters. Override by copying to local.toml or via CLI.
# Every knob a presenter might want to tweak lives here.

[setup]
apt_packages = [
    "stress-ng",
    "fio",
    "iperf3",
    "smartmontools",
    "ethtool",
    "numactl",
    "lldpd",
    "sysstat",
    "sysbench",
    "dmidecode",
]
ssh_connect_timeout_seconds = 15
# When true, the apt_install activity also sets the mesh interface MTU
# to [network.mesh].mtu. Switch off if the upstream switch can't carry
# jumbo frames and you want to leave the NIC at its default.
set_mesh_mtu = true

[stress.cpu]
duration_seconds = 60
workers = 0  # 0 = one worker per logical CPU

[stress.memory]
percent_of_total = 80
duration_seconds = 60
verify = true

[stress.disk_fio]
size = "2G"
runtime_seconds = 30
ioengine = "libaio"
direct = 1
profiles = [
    { name = "seq_read",  rw = "read",      bs = "1M",  iodepth = 32 },
    { name = "seq_write", rw = "write",     bs = "1M",  iodepth = 32 },
    { name = "rand_read", rw = "randread",  bs = "4k",  iodepth = 64 },
    { name = "rand_write",rw = "randwrite", bs = "4k",  iodepth = 64 },
]

[stress.sysbench_cpu]
max_prime = 100000
threads = 0  # 0 = one thread per logical CPU
duration_seconds = 30

[network.mesh]
duration_seconds = 20
parallel_streams = 4
mtu = 9000
verify_jumbo_frames = true
min_throughput_gbps = 20.0
max_retransmits = 100

[network.encapsulation]
tunnel_types = ["vxlan", "geneve"]
duration_seconds = 20
compare_offload = true

[report]
fail_on_smart_error = true
fail_on_memory_hw_error = true

[temporal]
host = "localhost:7233"
namespace = "openstack-test"
task_queue = "bare-metal-tests"

[temporal.timeouts_seconds]
setup            = 600
hardware_probe   = 120
stress_cpu       = 180
stress_memory    = 180
stress_disk_fio  = 600
sysbench_cpu     = 120
network_mesh     = 120
encapsulation    = 180
persist_results  = 60

[temporal.retry]
initial_interval_seconds = 2
backoff_coefficient = 2.0
maximum_attempts = 3

[worker]
max_concurrent_activities = 32
max_concurrent_workflow_tasks = 100

[database]
schema = "bmt"
pool_min_size = 2
pool_max_size = 10
