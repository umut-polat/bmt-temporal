[project]
name = "bare-metal-tests"
version = "0.1.0"
description = "Temporal-based bare metal hardware test automation"
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.27.2",
    "asyncssh>=2.18",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
bmt-worker = "bare_metal_tests.worker:main"
bmt-run = "bare_metal_tests.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bare_metal_tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET", "PL", "RUF", "D"]
ignore = [
    "PLR0913",  # too many args is fine for config-driven plans
    "PLR2004",  # asserting on a literal in tests is fine
    "D101",     # docstrings on tiny config classes add noise
    "D102",     # ditto for short methods
    "D105",     # __aenter__ etc. don't need docstrings
    "D107",     # __init__ docstring is redundant if class has one
    "D203", "D213",  # mutually exclusive with the style we picked
    "PLW0603",  # we use one module-level pool singleton on purpose
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# Temporal's typed workflow stubs reject our pure-callable shorthand even
# though it is the documented public API; the runtime is happy.
[[tool.mypy.overrides]]
module = [
    "bare_metal_tests.cli",
    "bare_metal_tests.workflows.batch",
]
disable_error_code = ["call-overload", "arg-type", "assignment", "misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
